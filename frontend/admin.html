<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f4ea8"><meta name="apple-mobile-web-app-capable" content="yes"><title>دخول صاحب المحل</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="images/icon-192.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css?v=39"></head><body>
<main class="app-shell"><header class="app-header"><img src="images/Logo.png"><h1>دخول صاحب المحل</h1></header><section class="card"><label>اسم المستخدم<input id="username" autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label><button id="login">دخول</button><p id="message" class="message"></p></section></main>
<script src="config.js?v=38"></script><script src="pwa.js?v=44"></script><script>const API=window.FADILA_API_URL;document.getElementById('login').onclick=async()=>{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}),d=await r.json();if(!r.ok||d.user?.role!=='owner'){message.textContent=d.error||'هذا الحساب ليس حساب صاحب المحل';message.className='message error';return}localStorage.setItem('token',d.token);location.href='dashboard.html'};</script></body></html>
